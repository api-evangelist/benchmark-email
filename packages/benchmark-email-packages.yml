name: Benchmark Email Client Packages
description: >-
  Benchmark Email publishes NO maintained first-party SDK for either of its two APIs. The
  new v1 API (developers.benchmarkemail.io, X-API-Key) ships an OpenAPI, an Agent Skill and
  a curl-first quickstart with no client library of any kind — its own documentation tells
  developers to hand the OpenAPI to an AI coding assistant instead. The only first-party
  code that exists is six abandoned GitHub wrappers for the retired XML-RPC v1.0 API, none
  of which was ever published to a package registry and none of which has been touched
  since 2018. Everything on a public registry is third-party.
