findings:
- >-
  Decay signal: the newest first-party client code of any kind is a 2018 commit, and the
  newest registry package that mentions Benchmark Email at all is a third-party gem from
  2019. Both predate the v1 API documented at developers.benchmarkemail.io. A developer
  who reaches for an SDK today will find only libraries for an API Benchmark no longer
  runs.
- >-
  This is a deliberate posture, not an oversight. The v1 API landing page
  (https://www.benchmarkemail.com/features/api/) offers "JSON over HTTP" and an "OpenAPI
  specification published", and tells the reader to "hand it to your developer, or use an
  AI coding assistant to build the integration yourself." The SDK layer has been replaced
  by the spec plus the Agent Skill.
- >-
  Consequence for scoring: there is no maintained official SDK to point an sdk_count check
  at. The six first-party repos are real provider-published client code and are recorded as
  official:true, but every one of them is registry-absent and stale by seven years or more.
