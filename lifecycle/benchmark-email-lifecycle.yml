recommendations:
- >-
  Publish a classic-to-v1 endpoint mapping. It is the single highest-value missing document
  for existing integrators.
- >-
  State a support position for the classic v3.0 API — maintained indefinitely, or sunsetting
  on a date. Right now an integrator cannot tell which.
- Archive the six XML-RPC wrapper repositories so search stops surfacing them as current.
- Ship Deprecation and Sunset headers (RFC 8594) before the first v1 breaking change.
