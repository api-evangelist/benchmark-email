method: derived
source: >-
  openapi/benchmark-email-api-openapi.json, openapi/*.yml (classic v3.0),
  https://developers.benchmarkemail.io/{authentication,rate-limits,errors}.md,
  https://www.benchmarkemail.com/privacy-policy/,
