- id: iso27001
  name: 'ISO/IEC 27001'
  conforms: unknown
  evidence: No ISO 27001 claim found on any public page.
- id: hipaa
  name: HIPAA
  conforms: false
  applicable: false
  evidence: No BAA or HIPAA claim published; the platform is not marketed for PHI.
