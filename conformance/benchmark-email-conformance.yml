- id: gdpr
  name: 'GDPR / UK GDPR'
  conforms: claimed
  evidence: >-
    https://www.benchmarkemail.com/privacy-policy/ names Benchmark Internet Group as data
    controller under GDPR and UK GDPR, describes a controller/processor split for customer
    data, and cites standard contractual clauses for cross-border transfer. Data residency
    options are published at https://www.benchmarkemail.com/data-regions/.
- id: ccpa
  name: 'CCPA / California Privacy'
  conforms: claimed
  evidence: The privacy policy carries a dedicated California Privacy section on access, deletion and sharing rights.
- id: can-spam
  name: 'CAN-SPAM / anti-spam policy'
  conforms: claimed
  evidence: >-
    A published anti-spam policy at https://www.benchmarkemail.com/anti-spam-policy/, and
