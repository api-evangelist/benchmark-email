  conforms: false
  applicable: false
  evidence: Not a financial API.
- id: psd2
  name: PSD2
  conforms: false
  applicable: false
  evidence: Not a payments API.
- id: tls
  name: TLS in transit
  conforms: true
  evidence: >-
    All hosts serve HTTPS. TLSv1.3 on www.benchmarkemail.com and
