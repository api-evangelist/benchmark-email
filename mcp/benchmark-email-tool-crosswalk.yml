notes:
- >-
  Confidence on every row is high because both sides were read from live sources on
  2026-08-13: the OpenAPI was fetched from the provider's own docs host and the MCP tool
  list came back unauthenticated from a real tools/list call.
- >-
  The gap is the finding. Benchmark Email has done the harder half of agent readiness, with
  a published OpenAPI, a published Agent Skill, an Agent Card, an llms.txt and a live MCP
  endpoint, but the MCP endpoint only describes the API. Wiring the forty REST operations
  into MCP tools would make the account itself callable by an agent.
