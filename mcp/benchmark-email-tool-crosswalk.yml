name: Benchmark Email MCP to REST Tool Crosswalk
description: >-
  Binds every tool on Benchmark Email's published MCP server to the REST operations it
  backs. The finding is a clean separation: the MCP server is a documentation-search
  server, so NONE of its three tools map to a REST operation, and ALL forty operations of
  the v1 REST API are rest_only. An agent can ask this MCP server how the API works, but
  it cannot use it to do anything in a Benchmark Email account.
surfaces:
  openapi:
    url: openapi/benchmark-email-api-openapi.json
    source: https://developers.benchmarkemail.io/openapi.json
    gated: false
    note: >-
      servers[] is templated as {apiBaseUrl} with an empty default; the real base is
      per-account and regional, https://api-{region}-{cluster}.benchmarkemail.io, shown on
      Settings > API Keys.
  mcp:
    url: https://developers.benchmarkemail.io/mcp
    gated: false
    note: Anonymous tools/list returned 200 with three tools on 2026-08-13.
  graphql: null
  legacy_openapi:
    url: openapi/benchmark-email-general-api-openapi.yml
    source: 'https://developer.benchmarkemail.com/ (Benchmark Classic RESTful API v3.0)'
    gated: false
    note: >-
      The classic v3.0 API (296 operations against clientapi.benchmarkemail.com, AuthToken
      header) is a separate product surface and is not crosswalked here. No MCP tool
      touches it either.
coverage:
  mcp_tools: 3
