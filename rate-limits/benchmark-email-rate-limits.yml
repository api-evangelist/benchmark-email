- api: Benchmark Email API v1
  type: API Key
  header: X-API-Key
  key_format: bme_{region}_{43 chars}
  scoped: true
  scopes:
  - contacts:read
  - contacts:write
  - campaigns:read
  - campaigns:write
  - reports:read
  - domains:read
  keyManagement:
