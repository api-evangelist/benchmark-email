    proKeys: 10
    enterpriseKeys: custom
    creator_role: Owner
    expiry: optional per key
    shown_once: true
  detail: authentication/benchmark-email-authentication.yml
- api: Benchmark Classic RESTful API v3.0
  type: API Key
  header: AuthToken
  scoped: false
  note: >-
    An Admin API Token from https://ui.benchmarkemail.com/Integrate#API, all-or-nothing over
    the account. The per-resource permission model (No Access / Read / Read & Write) belongs
    to the v1 API key system, not to this token.
enforcement:
- Both APIs return HTTP 429 on exhaustion.
- >-
  The v1 API returns five rate-limit headers on every successful key request; the classic
  API returns none.
- >-
  On v1, the hourly and monthly limits apply concurrently and the hourly budget is shared
  across every key on the account, so adding integrations does not add capacity.
- >-
  Exceeding limits does not incur overage charges. Raising the monthly quota means moving
  to a plan with a higher contact limit, since the quota is a multiple of it.
gaps:
- >-
  The two APIs publish incompatible limits (3,600/hour versus 500 per 2 minutes and
  60,000/day) with no reconciliation, so a customer running both surfaces has two budgets to
  reason about.
- >-
  X- prefixed headers rather than the IETF RateLimit-Limit/Remaining/Reset draft.
- No published burst allowance or leaky-bucket behaviour on either API.
- >-
  The failed-authentication IP block has no published threshold or duration, so a client
  cannot pre-empt it.
