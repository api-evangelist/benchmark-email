name: Benchmark Email API Rate Limits
url: https://developers.benchmarkemail.io/rate-limits
description: >-
  Benchmark Email publishes exact rate limits for BOTH of its APIs, and they are completely
  different numbers on completely different windows. The new v1 API runs an hourly limit
  plus a plan-derived monthly quota, signalled with five response headers. The classic v3.0
  API runs a 2-minute burst limit plus a daily cap. Neither uses the IETF RateLimit header
  draft; both use X- prefixed headers, and both return 429 with Retry-After on exhaustion.
created: '2026-06-13'
modified: '2026-08-13'
limit_count: 6
apis:
- api: benchmark-email:benchmark-email-api
  name: Benchmark Email API v1
  host: https://api-{region}-{cluster}.benchmarkemail.io
  auth_header: X-API-Key
  docs: https://developers.benchmarkemail.io/rate-limits
  rateLimits:
  - name: Hourly rate limit
    description: >-
      3,600 requests per hour, roughly one per second sustained. Shared across every API key
      on the account, not per key.
    limit: 3600
    window: 1 hour
    scope: account
    burst: none published
    headers:
    - name: X-RateLimit-Limit
      description: Maximum requests allowed per hour
      example: '3600'
    - name: X-RateLimit-Remaining
      description: Requests remaining in the current hour
      example: '3542'
    - name: X-RateLimit-Reset
      description: Unix timestamp in seconds when the hourly window resets
      example: '1711828800'
  - name: Monthly quota
    description: >-
      Plan-derived request quota that resets at the start of each billing period.
    limit: contact limit x 10 (Free) / contact limit x 100 (paid)
    limit_examples:
    - plan: Free (500 contacts)
      requests_per_month: 5000
    - plan: Pro (1,000 contacts)
      requests_per_month: 100000
    - plan: Pro (100,000 contacts)
      requests_per_month: 10000000
    window: billing period
    scope: account
    headers:
    - name: X-Monthly-Limit
      description: Maximum requests allowed in the current billing period
      example: '100000'
    - name: X-Monthly-Remaining
      description: Requests remaining in the current billing period
      example: '98750'
  - name: Failed-authentication IP block
    description: >-
      Anti-brute-force protection. An IP sending too many requests with invalid API keys is
      temporarily blocked and receives 429 for all API-key requests during the block.
    limit: not published
    window: not published
    scope: source IP address
    headers:
    - name: Retry-After
      description: Seconds until the block expires
  exhaustion:
    status: 429
    errorType: TooManyRequestsError
    retry_after_header: true
    messages:
    - Rate limit exceeded. Retry after 45 seconds.
    - Monthly API quota exceeded.
    - Too many failed authentication attempts. Please try again later.
    published_backoff: min(Retry-After * 2^attempt, 300)
    backoff_cap_seconds: 300
- api: Benchmark Classic RESTful API v3.0
  name: Benchmark Classic RESTful API v3.0
  host: https://clientapi.benchmarkemail.com
  auth_header: AuthToken
  docs: https://developer.benchmarkemail.com/
  rateLimits:
  - name: Short-window rate limit
    description: >-
      500 calls per 2 minutes, stated verbatim in the API's own collection description
      ("Our APIs give you a limit of 500 calls per 2 minutes") and repeated in the OpenAPI
      info.description.
    limit: 500
    window: 2 minutes
    scope: account
  - name: Daily rate limit
    description: 60,000 calls total per day.
    limit: 60000
    window: 1 day
    scope: account
  exhaustion:
    status: 429
    note: >-
      The classic documentation does not publish an error body, a header set or a
      Retry-After contract for exhaustion. The OpenAPI declares only 200/400/401/404 on its
      operations.
  headers:
    published: false
    note: >-
      No rate-limit response headers are documented for the classic API. A client has no
      runtime signal and must count its own calls.
