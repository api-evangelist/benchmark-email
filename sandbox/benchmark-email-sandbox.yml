mitigations_available_to_developers:
- >-
  The Free plan (500 contacts, 2,500 sends/month, two API keys) is the de facto test
  environment — a developer can open a second free account and point a test key at it.
- >-
  Campaign SENDING is UI-only, so a mistaken API call cannot email real recipients. Writes
  are destructive to contact data but not to a customer's inbox, which materially lowers
  the blast radius of testing against live.
risks:
- >-
  DELETE /api/contact/{contactId} is documented as permanent and cannot be undone. With no
  sandbox, that operation can only be exercised against real data.
- >-
  Rate-limit and quota behaviour (3,600/hour, monthly quota) can only be tested by
  consuming the live account's real budget.
