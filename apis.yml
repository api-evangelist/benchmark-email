aid: benchmark-email
name: Benchmark Email
description: Benchmark Email is an email marketing platform for small businesses, run by
  Benchmark Internet Group, with two live REST API generations. The current Benchmark Email
  API on the benchmarkemail.io platform covers contacts, contact structures and custom fields,
  lists, campaigns, templates, sending domains and reports across 40 operations, authenticated
  with a scoped X-API-Key against a per-account regional base URL. The classic RESTful API
  v3.0 on clientapi.benchmarkemail.com remains live and documented with 296 operations
  covering automations, surveys, polls, sub-accounts, galleries and push webhooks. Benchmark
  publishes an OpenAPI, two llms.txt files, an A2A Agent Card, an Agent Skill and a live
  documentation MCP endpoint, but ships no maintained SDK, no sandbox, no changelog and no
  deprecation policy.
