gaps:
- >-
  No security.txt (RFC 9116) on any host. Benchmark Email publishes no machine-readable
  vulnerability-disclosure contact.
- >-
  No /.well-known/api-catalog (RFC 9727) linking the two API surfaces, which is the one
  discovery document that would tie the classic v3.0 API and the new v1 API together.
- >-
  app.benchmarkemail.io answers 200 with the SPA shell for every /.well-known/* path. Any
  scanner that trusts a status code over a content type will read this host as serving
  eight documents it does not serve.
