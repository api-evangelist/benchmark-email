      description: 'Get a list of contacts


        URL Parameters


        KeyRequiredTypeDescription


        {{ID}}requiredstringID of the Email


        {{RType}}requiredstringType of report:

        1 or 8 Clicks

        2 Forwards

        3 Bounces

        4 Complaints

        5 Unsubscribes

        6 Opens

        <code'
    servers:
    - url: https://clientapi.benchmarkemail.com
      description: Benchmark Email Client API
  /Emails/{ID}/Report/Unsubscribes:
    get:
      tags:
      - Reports
      summary: GET Unsubscribe report By Email ID
      operationId: get__emails__id__report_unsubscribes
      parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
      description: 'GET Unsubscribe report By Email ID


        URL Parameters


        KeyRequiredTypeDescription


        {{ID}}requiredstringID of the Email


        Response body parameters


        KeyTypeDescription


        Statusstring1 if successful, -1 if error


        <t'
    servers:
    - url: https://clientapi.benchmarkemail.com
      description: Benchmark Email Client API
  /Emails/SaveAsList:
    patch:
      tags:
      - Reports
      summary: Save as List
      operationId: patch__emails_saveaslist
      parameters: []
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
