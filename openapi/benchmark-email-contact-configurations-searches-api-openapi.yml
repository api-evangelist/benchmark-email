        SearchoptionalstringSearch value like email address


        FilteroptionalstringFilter value


        Body Parameters (To be passed as a JSON string)


        Key'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: AuthToken
      description: API token obtained from https://ui.benchmarkemail.com/Integrate#API
