openapi: 3.2.0
info:
  description: 'Public REST API for Benchmark Email.


    Authenticate every request by including your API key in the `X-API-Key` header.

    Each key is issued with one or more scopes that control which endpoints it may call.


    Rate limits: 60 requests per minute per account.

    Monthly quota: determined by your subscription plan.'
  title: Benchmark Email Email Domain API
  version: 1.0.0
servers:
- description: Your account's API base URL. Copy the full URL shown on Settings > API Keys in your Benchmark Email account and paste it here.
  url: '{apiBaseUrl}'
  variables:
    apiBaseUrl:
      default: ''
      description: Your account's API base URL. Copy it from Settings > API Keys in your Benchmark Email account.
security:
- apiKeyAuth: []
tags:
- description: Email domain related endpoints
  name: email-domain
paths:
  /api/email/domain:
    get:
      operationId: get_api_email_domain
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    _id:
                      description: Id of the domain
                      type: string
                    createdAt:
                      description: Date of creation
                      type: string
                    dkim:
                      description: DKIM (DomainKeys Identified Mail) configuration (multi-record domains only)
                      properties:
                        records:
                          description: DNS records (CNAME record)
                          items:
                            properties:
                              name:
                                description: DNS record name
                                type: string
                              ttl:
                                description: Time to live in seconds
                                type: number
                              type:
                                description: DNS record type (MX, TXT, CNAME)
                                type: string
                              value:
                                description: DNS record value
                                type: string
                            type: object
                          type: array
                        status:
                          description: Verification status (pending, success)
                          type: string
                        verificationInfo:
                          description: Verification details
                          properties:
                            errorCode:
                              description: Error code if verification failed
                              type: string
                            lastRecordFound:
                              description: Raw DNS record value from the most recent verification lookup. null if no record was found. Absent if never checked.
                              maxLength: 512
                              type:
                              - string
                              - 'null'
                          type: object
                      type: object
                    dmarc:
                      description: DMARC (Domain-based Message Authentication, Reporting & Conformance) configuration with status and DNS records (multi-record domains only)
                      properties:
                        records:
                          description: DNS records (TXT record)
                          items:
                            properties:
                              name:
                                description: DNS record name
                                type: string
                              ttl:
                                description: Time to live in seconds
                                type: number
                              type:
                                description: DNS record type (MX, TXT, CNAME)
                                type: string
                              value:
                                description: DNS record value
                                type: string
                            type: object
                          type: array
                        status:
                          description: Verification status (pending, success)
                          type: string
                        verificationInfo:
                          description: Verification details
                          properties:
                            errorCode:
                              description: Error code if verification failed
                              type: string
                            lastRecordFound:
                              description: Raw DNS record value from the most recent verification lookup. null if no record was found. Absent if never checked.
                              maxLength: 512
                              type:
                              - string
                              - 'null'
                          type: object
                      type: object
                    domain:
                      description: Domain name
                      type: string
                    identity:
                      description: Domain identity information (not present in multi-record domains - see spf/dkim sections instead)
                      properties:
                        mailFrom:
                          description: Mail-from configuration
                          properties:
                            status:
                              description: Mail-from status
                              type: string
                            subdomain:
                              description: Mail-from subdomain
                              type: string
                          type: object
                        status:
                          description: Identity status (pending, created, verified, failed)
                          type: string
                        verificationInfo:
                          description: Verification status and details
                          properties:
                            errorCode:
                              description: Error code if verification failed
                              type: string
                            lastCheckedAt:
                              description: Timestamp of last verification check
                              format: date-time
                              type: string
                            lastRecordFound:
                              description: DKIM CNAME value from the most recent diagnostic DNS lookup. null if no record was found. Absent if never checked.
                              maxLength: 512
                              type:
                              - string
                              - 'null'
                            lastSuccessAt:
                              description: Timestamp of last successful verification
                              format: date-time
                              type: string
                          type: object
                        verificationStatus:
                          description: Overall verification status
                          type: string
                      type: object
                    isReadyForSending:
